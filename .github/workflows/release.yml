name: Release

on:
  push:
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: NickelModManager

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## " tag { found = 1; next }
            found && /^## /  { exit }
            found            { print }
          ' CHANGELOG.md > release-notes.md

          # CHANGELOG.md is the source of the release notes: refuse to publish
          # a release whose section is missing or empty.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No '## $GITHUB_REF_NAME' section found in CHANGELOG.md. Add one before tagging."
            exit 1
          fi

      # Only the firmware 4.x package is released for now.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: KoboRoot.tgz
